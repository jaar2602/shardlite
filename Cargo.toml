[package]
name = "meshdb"
version = "0.1.0"
edition = "2024"

[dependencies]
# `bundled` is a correctness requirement, not a convenience: replication is byte-level,
# so every node in a cluster must link the exact same SQLite. Linking the host distro's
# libsqlite3 would let version skew across nodes become silent state divergence.
#
# Both are pinned exactly and must move together. This is a deliberate replication
# requirement, not a workaround — the bundled SQLite version is not something to let cargo
# drift, because it determines the on-disk WAL byte layout the VFS capture depends on.
#
# Bundled SQLite: 3.53.2. Requires Rust >= 1.94 (libsqlite3-sys 0.38.x build.rs uses
# `cfg_select!`, stabilized after 1.93).
rusqlite = { version = "=0.40.1", features = ["bundled", "hooks", "backup", "limits", "functions", "trace"] }
libsqlite3-sys = "=0.38.1"
thiserror = "2.0"
# mpmc, so N reader threads can share one receiver and race to take work. `std::sync::mpsc`
# receivers cannot be shared, and `Arc<Mutex<Receiver>>` deadlocks: a reader blocking in
# `recv` while holding the lock starves every other reader. Default features off (drops
# the async/select machinery); the async half is available when the network server needs it.
flume = { version = "0.12.0", default-features = false }
tracing = "0.1.44"
# Only the binary installs a subscriber, behind a feature so `cargo test` and library
# consumers do not pull it in.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
sqlparser = "0.62.0"

[[bench]]
name = "write_throughput"
harness = false

[dev-dependencies]
tempfile = "3"

[features]
default = ["cli"]
# Only the binary installs a subscriber. The library emits events through the `tracing`
# facade and installs nothing, so a consumer chooses its own destination — or none, in
# which case the macros compile to near-nothing.
cli = ["dep:tracing-subscriber"]
